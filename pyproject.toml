[project]
name = "strategy-backend"
version = "0.1.0"
description = "Backend skeleton for the strategy assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "jsonschema[format]>=4.23,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live_model: opt-in real model access; consumes account limits/credits"]
