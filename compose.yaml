name: strategy-assistant

services:
  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_DATA_DIR: /data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/data

  worker:
    profiles: ["worker"]
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_DATA_DIR: /data
    volumes:
      - backend_data:/data
    healthcheck:
      disable: true
    stop_grace_period: 330s

volumes:
  backend_data:
